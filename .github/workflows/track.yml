name: Track VT-JJL

on:
  schedule:
    # Every 5 minutes. GitHub may delay this under load; treat it as
    # "roughly every 5 min", not exact.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_post:
        description: "Send a test post to Bluesky instead of checking the aircraft"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit state.json back to the repo

concurrency:
  group: vtjjl-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TAIL_NUMBER: "VT-JJL"
          DISPLAY_NAME: "VDS' Helicopter"
          TEST_POST: ${{ inputs.test_post }}
        run: python track_helicopter.py

      - name: Commit updated state
        run: |
          git config user.name "vtjjl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update tracker state [skip ci]"
          git push
