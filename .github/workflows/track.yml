name: Track VT-JJL

on:
  schedule:
    # GitHub's own 5-minute scheduling was unreliable in practice (runs
    # silently skipped or fired hours late). Instead, each run below stays
    # alive and polls internally every 5 minutes for ~5h40m, so GitHub only
    # needs to successfully start a job roughly once every 5 hours -- far
    # less prone to being dropped. Consecutive runs overlap by ~40 minutes
    # as a buffer against scheduling delays.
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      test_post:
        description: "Send a test post to Bluesky instead of checking the aircraft"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit state.json back to the repo

concurrency:
  group: vtjjl-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TAIL_NUMBER: "VT-JJL"
          DISPLAY_NAME: "VDS' helicopter"
          TEST_POST: ${{ inputs.test_post }}
        run: python track_helicopter.py

      - name: Commit updated state
        run: |
          git config user.name "vtjjl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update tracker state [skip ci]"
          git push
